<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Machine Shift Configurator</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f4;color:#1c1c1a;font-size:14px;min-height:100vh}
header{background:#fff;border-bottom:1px solid #e0dfd8;padding:16px 24px;display:flex;align-items:center;gap:12px}
header h1{font-size:17px;font-weight:600}
header span{font-size:13px;color:#888}
.container{max-width:1060px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e0dfd8;border-radius:10px;padding:16px 20px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.machine-list{display:flex;flex-direction:column;gap:8px}
.machine-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f9f9f7;border:1px solid #e0dfd8;border-radius:8px}
.machine-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;cursor:pointer;border:none;padding:0}
.machine-name-inp{flex:1;background:transparent;border:none;font-size:14px;font-weight:500;color:#1c1c1a;outline:none;min-width:0}
.machine-meta{font-size:11px;color:#999;white-space:nowrap}
.btn-icon{background:none;border:none;cursor:pointer;color:#aaa;padding:4px 6px;border-radius:6px;font-size:16px;line-height:1;display:flex;align-items:center}
.btn-icon:hover{background:#f0f0ee;color:#444}
.btn-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;border:1px dashed #ccc;border-radius:8px;background:none;cursor:pointer;font-size:13px;color:#888;margin-top:6px}
.btn-add:hover{background:#f5f5f3;color:#444}
.machine-panel{background:#fff;border:1px solid #e0dfd8;border-radius:10px;margin-bottom:12px;overflow:hidden}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none;border-bottom:1px solid #f0f0ee}
.panel-header-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.panel-name{font-size:15px;font-weight:500}
.panel-badge{font-size:12px;color:#888;background:#f5f5f3;border:1px solid #e0dfd8;padding:2px 9px;border-radius:20px}
.chevron{font-size:18px;color:#aaa;transition:transform .2s}
.chevron.open{transform:rotate(180deg)}
.panel-body{padding:14px 18px}
.sec-toggle{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;user-select:none;font-size:12px;font-weight:600;margin-bottom:10px}
.sec-toggle .s-arr{font-size:11px;transition:transform .2s;margin-left:auto}
.sec-toggle .s-arr.open{transform:rotate(180deg)}
.tog-blue{background:#f0f4ff;border:1px solid #d0daf5;color:#3a5bbf}
.tog-blue:hover{background:#e6ecff}
.tog-green{background:#f0faf5;border:1px solid #b0dfc5;color:#1a7a54}
.tog-green:hover{background:#e0f5ea}
.tog-purple{background:#f8f0ff;border:1px solid #d8b4fe;color:#6d28d9}
.tog-purple:hover{background:#f0e6ff}
.sec-body-blue{background:#f7f9ff;border:1px solid #d0daf5;border-radius:8px;padding:10px 12px 12px;margin-bottom:12px}
.sec-body-green{background:#f5fbf7;border:1px solid #b0dfc5;border-radius:8px;padding:10px 12px 12px;margin-bottom:12px}
.sec-body-purple{background:#fdf8ff;border:1px solid #d8b4fe;border-radius:8px;padding:10px 12px 12px;margin-bottom:12px}
.cost-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;background:#fffbf0;border:1px solid #f5dfa0;border-radius:8px}
.cost-row-lbl{font-size:12px;font-weight:600;color:#7a5100;white-space:nowrap}
.rate-wrap{display:flex;align-items:center;border:1px solid #d8d7d0;border-radius:7px;background:#fff;overflow:hidden;height:28px}
.rate-pfx{font-size:11px;color:#aaa;padding:0 5px;border-right:1px solid #e0dfd8;background:#f5f5f3;height:100%;display:flex;align-items:center;white-space:nowrap}
.rate-inp{flex:1;border:none;font-size:12px;font-weight:600;color:#1c1c1a;outline:none;padding:0 5px;min-width:0;-moz-appearance:textfield;background:#fff;width:60px}
.rate-inp::-webkit-outer-spin-button,.rate-inp::-webkit-inner-spin-button{-webkit-appearance:none}
.pattern-list{display:flex;flex-direction:column;gap:10px}
.pattern-card{border:1px solid #d8b4fe;border-radius:8px;overflow:hidden}
.pattern-hdr{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f8f0ff;border-bottom:1px solid #e9d5ff}
.pattern-name-inp{flex:1;background:transparent;border:none;font-size:13px;font-weight:600;color:#4c1d95;outline:none;min-width:0}
.pattern-body{padding:10px 12px}
.shift-grid-hdr{display:grid;grid-template-columns:1fr 64px 64px 50px 88px 56px 60px 28px;gap:4px;margin-bottom:5px}
.col-lbl{font-size:10px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.04em}
.shift-block{border:1px solid #e8e7e0;border-radius:8px;margin-bottom:8px;overflow:hidden}
.shift-main-row{display:grid;grid-template-columns:1fr 64px 64px 50px 88px 56px 60px 28px;gap:4px;align-items:center;padding:7px 8px;background:#fafaf8}
input[type=text],input[type=time]{width:100%;padding:3px 2px;font-size:12px;border:1px solid #d8d7d0;border-radius:7px;background:#fff;color:#1c1c1a;outline:none}
input[type=text]:focus,input[type=time]:focus{border-color:#378ADD;box-shadow:0 0 0 3px rgba(55,138,221,.12)}
.hours-lbl{font-size:11px;font-weight:600;color:#555;text-align:center;padding:3px 1px;background:#f5f5f3;border:1px solid #e0dfd8;border-radius:7px;white-space:nowrap}
.ops-stepper{display:flex;align-items:stretch;border-radius:7px;overflow:hidden;border:2px solid #378ADD;height:26px}
.ops-stepper button{width:20px;background:#378ADD;border:none;color:#fff;font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ops-stepper button:hover{background:#185FA5}
.ops-stepper input{flex:1;min-width:0;border:none;border-left:2px solid #378ADD;border-right:2px solid #378ADD;background:#fff;color:#1c1c1a;font-size:12px;font-weight:700;text-align:center;outline:none;-moz-appearance:textfield}
.ops-stepper input::-webkit-outer-spin-button,.ops-stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.cost-lbl{font-size:10px;font-weight:700;color:#7a5100;text-align:center;padding:3px 2px;background:#fffbf0;border:1px solid #f5dfa0;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt-toggle{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid #e8e7e0;background:#f5f4f0;cursor:pointer;user-select:none;font-size:11px;color:#666;font-weight:500}
.dt-toggle:hover{background:#efede8}
.dt-toggle .dt-arr{font-size:11px;color:#aaa;transition:transform .2s;margin-left:auto}
.dt-toggle .dt-arr.open{transform:rotate(180deg)}
.dt-toggle .dt-sum{margin-left:auto;margin-right:6px;font-size:11px;font-weight:600}
.dt-body{padding:10px 12px 12px;background:#fffdf9;border-top:1px solid #e8e7e0}
.dt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.dt-item{display:flex;flex-direction:column;gap:4px}
.dt-label{font-size:11px;font-weight:600;color:#888;display:flex;align-items:center;gap:5px}
.dt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dt-input-row{display:flex;align-items:center;gap:6px}
.dt-inp{width:68px;padding:5px 7px;font-size:13px;font-weight:600;border:1px solid #d8d7d0;border-radius:7px;background:#fff;color:#1c1c1a;outline:none;text-align:center;-moz-appearance:textfield}
.dt-inp::-webkit-outer-spin-button,.dt-inp::-webkit-inner-spin-button{-webkit-appearance:none}
.dt-inp:focus{border-color:#e67e22;box-shadow:0 0 0 3px rgba(230,126,34,.12)}
.dt-unit{font-size:12px;color:#aaa}
.prod-row{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed #e0dfd8}
.prod-lbl{font-size:12px;color:#666;white-space:nowrap}
.bar-track{flex:1;height:9px;background:#e8e7e0;border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px;transition:width .3s}
.prod-val{font-size:12px;font-weight:700;white-space:nowrap;min-width:80px;text-align:right}
.months-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.month-item{display:flex;flex-direction:column;gap:3px;background:#f9f9f7;border:1px solid #e0dfd8;border-radius:8px;padding:8px}
.month-lbl{font-size:11px;font-weight:600;color:#555}
.month-days-row{display:flex;align-items:center;gap:6px}
.month-days-inp{width:54px;padding:4px;font-size:13px;font-weight:600;border:1px solid #d8d7d0;border-radius:6px;text-align:center;outline:none;-moz-appearance:textfield}
.month-days-inp::-webkit-outer-spin-button,.month-days-inp::-webkit-inner-spin-button{-webkit-appearance:none}
.month-days-inp:focus{border-color:#1D9E75;box-shadow:0 0 0 3px rgba(29,158,117,.12)}
.month-pat-sel{flex:1;font-size:11px;border:1px solid #d8d7d0;border-radius:6px;padding:4px;background:#fff;outline:none;color:#1c1c1a}
.sum-sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;cursor:pointer;user-select:none;border-bottom:1px solid #e0dfd8;margin-bottom:12px}
.sum-sec-hdr span{font-size:13px;font-weight:600;color:#444}
.sum-sec-hdr .arr{font-size:11px;color:#aaa;transition:transform .2s}
.sum-sec-hdr .arr.open{transform:rotate(180deg)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:4px}
.metric{background:#f9f9f7;border-radius:8px;padding:12px;text-align:center}
.metric-lbl{font-size:11px;color:#888;margin-bottom:4px}
.metric-val{font-size:20px;font-weight:600;color:#1c1c1a}
.metric.cost{background:#fffbf0;border:1px solid #f5dfa0}
.metric.cost .metric-lbl{color:#7a5100}
.metric.cost .metric-val{color:#7a5100;font-size:16px}
.ann-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.ann-table th{font-size:10px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.04em;padding:5px 7px;text-align:left;border-bottom:1px solid #e0dfd8;white-space:nowrap}
.ann-table tbody tr td{padding:6px 7px;border-bottom:1px solid #f0f0ee;white-space:nowrap;font-weight:400}
.ann-table tbody tr.totals-row td{font-weight:700;background:#f5f5f3;border-bottom:none}
.pill{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700}
.apply-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:8px;border:1px solid #378ADD;border-radius:8px;background:#eef5fc;cursor:pointer;font-size:12px;font-weight:600;color:#378ADD;margin-top:10px}
.apply-btn:hover{background:#d6eaf8}
.action-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;font-weight:500;color:#333;margin-top:8px}
.action-btn:hover{background:#f5f5f3}
.action-btn-blue{border-color:#d0daf5;background:#f0f4ff;color:#3a5bbf}
.action-btn-blue:hover{background:#e6ecff}
input.inp-err{border-color:#c0392b!important;background:#fff8f8!important;box-shadow:0 0 0 3px rgba(192,57,43,.12)!important}
input.inp-warn{border-color:#e67e22!important;background:#fffaf5!important;box-shadow:0 0 0 3px rgba(230,126,34,.12)!important}
.shift-errors{padding:5px 10px 6px;display:flex;flex-direction:column;gap:3px;background:#fff8f8;border-top:1px solid #f5c6c6}
.shift-warn-row{background:#fffaf3;border-top:1px solid #fde8c8}
.err-line{font-size:11px;color:#c0392b;display:flex;align-items:center;gap:5px}
.warn-line{font-size:11px;color:#b7610a;display:flex;align-items:center;gap:5px}
.val-banner{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:500;margin-bottom:12px}
.val-banner.error{background:#fdf0ef;border:1px solid #f5c6c6;color:#922b21}
.val-banner.ok{background:#edfaf5;border:1px solid #a9dfcc;color:#1a7a54}
.overflow-x{overflow-x:auto}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:12px}
.modal-hdr{display:flex;align-items:center;justify-content:space-between}
.modal-title{font-weight:600;font-size:15px}
.modal-close{border:none;background:#f0f0ee;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
.modal-desc{font-size:12px;color:#666}
.modal-ta{font-family:monospace;font-size:10px;border:1px solid #d8d7d0;border-radius:8px;padding:10px;resize:none;color:#1c1c1a;width:100%;height:200px}
.modal-url-ta{font-family:monospace;font-size:10px;border:1px solid #d8d7d0;border-radius:8px;padding:10px;resize:none;color:#1c1c1a;width:100%;height:80px}
.modal-copy-btn{padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;color:#fff}
</style>
</head>
<body>
<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#378ADD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-4 0v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
  <h1>Machine Shift Configurator</h1>
  <span id="hdr-meta"></span>
</header>
<div class="container">
  <div class="card">
    <div class="card-title">Machines &amp; Equipment</div>
    <div class="machine-list" id="machineList"></div>
    <button class="btn-add" onclick="addMachine()">+ Add machine</button>
  </div>
  <div id="shiftPanels"></div>
  <div class="card">
    <div class="sum-sec-hdr" onclick="toggleSum('shift')"><span>Shift Summary</span><span class="arr open" id="sarr-shift">&#9660;</span></div>
    <div id="sum-shift"></div>
  </div>
  <div class="card">
    <div class="sum-sec-hdr" onclick="toggleSum('annual')"><span>Annual Summary</span><span class="arr open" id="sarr-annual">&#9660;</span></div>
    <div id="sum-annual"></div>
  </div>
  <div class="card">
    <div class="sum-sec-hdr" onclick="toggleSum('monthly')"><span>Monthly Summary</span><span class="arr open" id="sarr-monthly">&#9660;</span></div>
    <div id="sum-monthly"></div>
  </div>
  <div id="valBanner"></div>
  <button class="action-btn" id="exportBtn" onclick="showExportModal()">&#8659; Export JSON</button>
  <button class="action-btn" onclick="document.getElementById('fileInput').click()">&#8657; Load JSON</button>
  <button class="action-btn action-btn-blue" onclick="showURLModal()">&#128279; Save to bookmarkable URL</button>
  <input type="file" id="fileInput" accept=".json" style="display:none"/>
</div>
<script>
// ── Constants ─────────────────────────────────────────────────────────────────
var COLORS=['#1D9E75','#378ADD','#D85A30','#7F77DD','#BA7517','#D4537E','#639922','#E24B4A'];
var DT_TYPES=[
  {key:'breaks',label:'Operator Breaks',color:'#e67e22'},
  {key:'maintenance',label:'Maintenance',color:'#8e44ad'},
  {key:'machineFail',label:'Machine Failure',color:'#c0392b'},
  {key:'opFail',label:'Operator Failure',color:'#d35400'},
  {key:'matFail',label:'Material Failure',color:'#c0392b'}
];
var GLOBAL_DEF={breaks:20,maintenance:10,machineFail:0,opFail:0,matFail:0};
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTH_DAYS=[31,28,31,30,31,30,31,31,30,31,30,31];
var sumOpen={shift:true,annual:true,monthly:true};

// ── Saved config (clean sheet) ────────────────────────────────────────────────
var SAVED_CONFIG={
  nextId:2, patNextId:2,
  machines:[{
    id:1,name:'Machine 1',active:true,open:false,
    defaultsOpen:false,opsOpen:false,patsOpen:false,
    baseRate:0,machRate:0,
    dtDefaults:{breaks:20,maintenance:10,machineFail:0,opFail:0,matFail:0},
    patterns:[{id:1,name:'Pattern A',shifts:[
      {name:'Day',start:'06:00',end:'14:00',operators:1,rateAdder:0,
       downtime:{breaks:20,maintenance:10,machineFail:0,opFail:0,matFail:0}}
    ]}],
    opDays:[{days:0,patId:null},{days:0,patId:null},{days:0,patId:null},{days:0,patId:null},
            {days:0,patId:null},{days:0,patId:null},{days:0,patId:null},{days:0,patId:null},
            {days:0,patId:null},{days:0,patId:null},{days:0,patId:null},{days:0,patId:null}]
  }]
};

// ── State ─────────────────────────────────────────────────────────────────────
var machines=[];
var nextId=1;
var patNextId=1;

// ── Helpers ───────────────────────────────────────────────────────────────────
function cloneDt(src){var o={};DT_TYPES.forEach(function(t){o[t.key]=(src&&src[t.key]!==undefined)?+src[t.key]:0;});return o;}
function defDt(){return cloneDt(GLOBAL_DEF);}
function emptyOpDays(){return MONTHS.map(function(){return{days:0,patId:null};});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function colorFor(i){return COLORS[i%COLORS.length];}
function fmt(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});}
function newPatId(){return patNextId++;}
function makePattern(name){
  return {id:newPatId(),name:name||'Pattern A',
    shifts:[{name:'Day',start:'06:00',end:'14:00',operators:1,rateAdder:0,dtOpen:false,downtime:defDt()}]};
}

// ── Math ──────────────────────────────────────────────────────────────────────
function shiftMins(s){
  var a=s.start.split(':'),b=s.end.split(':');
  var m=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);
  if(m<=0)m+=1440;return m;
}
function shiftLabel(s){var t=shiftMins(s),h=Math.floor(t/60),m=t%60;return m?h+'h '+m+'m':h+'h';}
function totalDtMins(s){return DT_TYPES.reduce(function(a,t){return a+(parseInt(s.downtime[t.key])||0);},0);}
function productiveMins(s){return Math.max(0,shiftMins(s)-totalDtMins(s));}
function productiveLabel(s){var p=productiveMins(s),h=Math.floor(p/60),m=p%60;return m?h+'h '+m+'m':h+'h';}
function productivePct(s){var t=shiftMins(s);return t?Math.round(productiveMins(s)/t*100):0;}
function shiftHours(s){return shiftMins(s)/60;}
function patHpd(pat){return pat.shifts.reduce(function(a,s){return a+shiftHours(s);},0);}
function patPhpd(pat){return pat.shifts.reduce(function(a,s){return a+productiveMins(s)/60;},0);}
function patOps(pat){return pat.shifts.reduce(function(a,s){return a+(parseInt(s.operators)||0);},0);}
function barColor(pct){return pct>=80?'#1D9E75':pct>=60?'#e67e22':'#c0392b';}
function pill(pct){return '<span class="pill" style="background:'+barColor(pct)+'22;color:'+barColor(pct)+'">'+pct+'%</span>';}
function shiftLabourCost(m,s){return ((parseFloat(m.baseRate)||0)+(parseFloat(s.rateAdder)||0))*shiftHours(s)*(parseInt(s.operators)||0);}
function shiftMachCost(m,s){return (parseFloat(m.machRate)||0)*shiftHours(s);}
function patLabourCostPd(m,pat){return pat.shifts.reduce(function(a,s){return a+shiftLabourCost(m,s);},0);}
function patMachCostPd(m,pat){return pat.shifts.reduce(function(a,s){return a+shiftMachCost(m,s);},0);}
function getPat(m,patId){
  if(!patId)return m.patterns[0]||null;
  return m.patterns.find(function(p){return p.id===+patId;})||m.patterns[0]||null;
}
function getMonthPat(m,mi){var od=m.opDays[mi];return getPat(m,od?od.patId:null);}
function annualOpDays(m){return m.opDays.reduce(function(a,od){return a+(od?od.days:0);},0);}
function annualSchedH(m){return m.opDays.reduce(function(a,od,mi){var p=getMonthPat(m,mi);return a+(od&&p&&od.patId?od.days*patHpd(p):0);},0);}
function annualProdH(m){return m.opDays.reduce(function(a,od,mi){var p=getMonthPat(m,mi);return a+(od&&p&&od.patId?od.days*patPhpd(p):0);},0);}
function annualLabourCost(m){return m.opDays.reduce(function(a,od,mi){var p=getMonthPat(m,mi);return a+(od&&p&&od.patId?od.days*patLabourCostPd(m,p):0);},0);}
function annualMachCost(m){return m.opDays.reduce(function(a,od,mi){var p=getMonthPat(m,mi);return a+(od&&p&&od.patId?od.days*patMachCostPd(m,p):0);},0);}
function annualTotalCost(m){return annualLabourCost(m)+annualMachCost(m);}
function annualAvail(m){var s=annualSchedH(m);return s?Math.round(annualProdH(m)/s*100):0;}
function annualAvail24(m){var s=annualOpDays(m)*24;return s?Math.round(annualProdH(m)/s*100):0;}

// ── Load config ───────────────────────────────────────────────────────────────
function applyPayload(payload){
  if(payload.patNextId)patNextId=payload.patNextId;
  if(payload.nextId)nextId=payload.nextId;
  machines=payload.machines.map(function(m){
    return {
      id:m.id||1,name:m.name||'Machine',active:m.active!==false,
      open:m.open||false,defaultsOpen:false,opsOpen:false,patsOpen:false,
      baseRate:parseFloat(m.baseRate)||0,machRate:parseFloat(m.machRate)||0,
      dtDefaults:cloneDt(m.dtDefaults||GLOBAL_DEF),
      patterns:(m.patterns&&m.patterns.length?m.patterns:[{id:newPatId(),name:'Pattern A',shifts:[]}]).map(function(pat){
        return {id:pat.id||newPatId(),name:pat.name||'Pattern',
          shifts:(pat.shifts||[]).map(function(s){
            return {name:s.name||'',start:s.start||'06:00',end:s.end||'14:00',
              operators:s.operators||1,rateAdder:parseFloat(s.rateAdder)||0,
              dtOpen:false,downtime:cloneDt(s.downtime||GLOBAL_DEF)};
          })};
      }),
      opDays:(m.opDays&&m.opDays.length===12?m.opDays:MONTHS.map(function(){return{days:0,patId:null};})).map(function(od){
        return{days:od.days||0,patId:od.patId||null};
      })
    };
  });
}

function loadFromURL(){
  try{
    var params=new URLSearchParams(window.location.search);
    var cfg=params.get('cfg');if(!cfg)return false;
    var payload=JSON.parse(decodeURIComponent(atob(cfg)));
    if(!payload||!Array.isArray(payload.machines)||!payload.machines.length)return false;
    applyPayload(payload);return true;
  }catch(e){console.warn('URL load failed:',e.message);return false;}
}

// ── Validation ────────────────────────────────────────────────────────────────
function validateShift(s,si,all){
  var errors=[],warnings=[];
  if(!s.name.trim())warnings.push('Shift name is empty.');
  if(s.start===s.end)errors.push('Start and end time are identical.');
  var dt=totalDtMins(s),sm=shiftMins(s);
  if(dt>sm)errors.push('Total downtime ('+dt+' min) exceeds shift duration ('+sm+' min).');
  else if(dt===sm)warnings.push('All shift time allocated to downtime.');
  var toM=function(t){var p=t.split(':');return +p[0]*60+ +p[1];};
  var sS=toM(s.start),sE=toM(s.end),sW=sE<=sS;
  all.forEach(function(o,oi){
    if(oi===si)return;
    var oS=toM(o.start),oE=toM(o.end),oW=oE<=oS;
    if(!sW&&!oW&&sS<oE&&sE>oS)warnings.push('Overlaps with "'+(o.name||'#'+(oi+1))+'".');
  });
  return{errors:errors,warnings:warnings};
}
function validateAll(){
  var r={};
  machines.forEach(function(m){
    m.patterns.forEach(function(pat){
      pat.shifts.forEach(function(s,si){
        var v=validateShift(s,si,pat.shifts);
        if(v.errors.length||v.warnings.length)r[m.id+'-'+pat.id+'-'+si]=v;
      });
    });
  });
  return r;
}

// ── Sync ──────────────────────────────────────────────────────────────────────
function syncAll(){
  document.querySelectorAll('[data-mn]').forEach(function(el){
    var m=machines.find(function(m){return m.id===+el.dataset.mn;});if(m)m.name=el.value;
  });
  document.querySelectorAll('[data-br]').forEach(function(el){
    var m=machines.find(function(m){return m.id===+el.dataset.mid;});if(m)m.baseRate=parseFloat(el.value)||0;
  });
  document.querySelectorAll('[data-mr]').forEach(function(el){
    var m=machines.find(function(m){return m.id===+el.dataset.mid;});if(m)m.machRate=parseFloat(el.value)||0;
  });
  document.querySelectorAll('[data-pn]').forEach(function(el){
    var m=machines.find(function(m){return m.id===+el.dataset.mid;});
    var pat=m&&m.patterns.find(function(p){return p.id===+el.dataset.pid;});
    if(pat)pat.name=el.value;
  });
  document.querySelectorAll('[data-sf]').forEach(function(el){
    var m=machines.find(function(m){return m.id===+el.dataset.mid;});
    var pat=m&&m.patterns.find(function(p){return p.id===+el.dataset.pid;});
    var s=pat&&pat.shifts[+el.dataset.si];if(!s)return;
    var f=el.dataset.f;
    if(f==='operators'){s.operators=Math.max(1,parseInt(el.value)||1);el.value=s.operators;}
    else if(f==='rateAdder'){s.rateAdder=parseFloat(el.value)||0;}
    else s[f]=el.value;
  });
  document.querySelectorAll('[data-dt]').forEach(function(el){
    var m=machines.find(function(m){return m.id===+el.dataset.mid;});
    var pat=m&&m.patterns.find(function(p){return p.id===+el.dataset.pid;});
    var s=pat&&pat.shifts[+el.dataset.si];if(!s)return;
    s.downtime[el.dataset.dt]=Math.max(0,parseInt(el.value)||0);
  });
  document.querySelectorAll('[data-mdef]').forEach(function(el){
    var m=machines.find(function(m){return m.id===+el.dataset.mid;});if(!m)return;
    m.dtDefaults[el.dataset.mdef]=Math.max(0,parseInt(el.value)||0);
  });
}

function updateOpDay(mid,mi,val){
  var m=machines.find(function(m){return m.id===mid;});if(!m)return;
  m.opDays[mi].days=Math.min(MONTH_DAYS[mi],Math.max(0,parseInt(val)||0));
  renderSummaries();
}
function updateOpPat(mid,mi,val){
  var m=machines.find(function(m){return m.id===mid;});if(!m)return;
  m.opDays[mi].patId=val?+val:null;
  renderSummaries();
}
function toggleSum(name){
  sumOpen[name]=!sumOpen[name];
  var el=document.getElementById('sum-'+name),arr=document.getElementById('sarr-'+name);
  if(el)el.style.display=sumOpen[name]?'':'none';
  if(arr){if(sumOpen[name])arr.classList.add('open');else arr.classList.remove('open');}
}

// ── Actions ───────────────────────────────────────────────────────────────────
function addMachine(){
  machines.push({id:nextId++,name:'New Machine',active:true,open:true,
    defaultsOpen:false,opsOpen:false,patsOpen:true,
    baseRate:0,machRate:0,dtDefaults:defDt(),
    patterns:[makePattern('Pattern A')],opDays:emptyOpDays()});
  renderAll(true);
}
function removeMachine(id){machines=machines.filter(function(m){return m.id!==id;});renderAll(true);}
function toggleOpen(id){syncAll();var m=machines.find(function(m){return m.id===id;});if(m)m.open=!m.open;renderAll(true);}
function toggleActive(id){var m=machines.find(function(m){return m.id===id;});if(m)m.active=!m.active;renderAll(true);}
function toggleDefaults(id){syncAll();var m=machines.find(function(m){return m.id===id;});if(m)m.defaultsOpen=!m.defaultsOpen;renderAll(true);}
function toggleOps(id){syncAll();var m=machines.find(function(m){return m.id===id;});if(m)m.opsOpen=!m.opsOpen;renderAll(true);}
function togglePats(id){syncAll();var m=machines.find(function(m){return m.id===id;});if(m)m.patsOpen=!m.patsOpen;renderAll(true);}
function applyDefaults(id){
  syncAll();var m=machines.find(function(m){return m.id===id;});if(!m)return;
  m.patterns.forEach(function(pat){pat.shifts.forEach(function(s){s.downtime=cloneDt(m.dtDefaults);});});
  renderAll(true);
}
function addPattern(mid){
  syncAll();var m=machines.find(function(m){return m.id===mid;});if(!m)return;
  var letters='ABCDEFGHIJ';
  m.patterns.push(makePattern('Pattern '+letters[m.patterns.length%10]));
  renderAll(true);
}
function removePattern(mid,pid){
  syncAll();var m=machines.find(function(m){return m.id===mid;});if(!m)return;
  if(m.patterns.length<=1){alert('At least one pattern is required.');return;}
  m.patterns=m.patterns.filter(function(p){return p.id!==pid;});
  m.opDays.forEach(function(od){if(od.patId===pid)od.patId=null;});
  renderAll(true);
}
function addShift(mid,pid){
  syncAll();var m=machines.find(function(m){return m.id===mid;});
  var pat=m&&m.patterns.find(function(p){return p.id===pid;});if(!pat)return;
  pat.shifts.push({name:'Shift '+(pat.shifts.length+1),start:'06:00',end:'14:00',
    operators:1,rateAdder:0,dtOpen:false,downtime:cloneDt(m.dtDefaults)});
  renderAll(true);
}
function removeShift(mid,pid,si){
  syncAll();var m=machines.find(function(m){return m.id===mid;});
  var pat=m&&m.patterns.find(function(p){return p.id===pid;});if(!pat)return;
  pat.shifts.splice(si,1);renderAll(true);
}
function toggleDt(mid,pid,si){
  syncAll();var m=machines.find(function(m){return m.id===mid;});
  var pat=m&&m.patterns.find(function(p){return p.id===pid;});if(!pat)return;
  pat.shifts[si].dtOpen=!pat.shifts[si].dtOpen;renderAll(true);
}
function stepOps(mid,pid,si,d){
  syncAll();var m=machines.find(function(m){return m.id===mid;});
  var pat=m&&m.patterns.find(function(p){return p.id===pid;});if(!pat)return;
  pat.shifts[si].operators=Math.max(1,(parseInt(pat.shifts[si].operators)||1)+d);
  var el=document.getElementById('ops-'+mid+'-'+pid+'-'+si);
  if(el)el.value=pat.shifts[si].operators;
  renderSummaries();
}

function buildPayload(){
  return{nextId:nextId,patNextId:patNextId,machines:machines.map(function(m){
    return{id:m.id,name:m.name,active:m.active,baseRate:m.baseRate,machRate:m.machRate,
      dtDefaults:m.dtDefaults,
      patterns:m.patterns.map(function(pat){

          return{name:s.name,start:s.start,end:s.end,operators:s.operators,rateAdder:s.rateAdder,downtime:s.downtime};
        })};
      }),
      opDays:m.opDays.map(function(od){return{days:od.days,patId:od.patId};})

  })};
}

document.getElementById('fileInput').addEventListener('change',function(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      if(!Array.isArray(data))throw new Error('Expected JSON array.');
      var payload={nextId:data.length+1,patNextId:99,machines:data.map(function(m,i){
        var def=m.defaultDowntime||GLOBAL_DEF;
        return{id:i+1,name:m.name||'Machine '+(i+1),active:m.active!==false,
          baseRate:parseFloat(m.baseRateUSD||m.baseRate)||0,
          machRate:parseFloat(m.machRateUSD||m.machRate)||0,
          dtDefaults:cloneDt(def),
          patterns:(m.patterns||[]).map(function(pat){
            return{id:pat.id||newPatId(),name:pat.name||'Pattern',
              shifts:(pat.shifts||[]).map(function(s){
                return{name:s.name||'',start:s.start||'06:00',end:s.end||'14:00',
                  operators:s.operators||1,rateAdder:parseFloat(s.rateAdderUSD||s.rateAdder)||0,
                  downtime:cloneDt(s.downtime||def)};
              })};
          }),
          opDays:m.operatingDays?m.operatingDays.map(function(od){
            return{days:od.days||0,patId:od.patternId||null};
          }):MONTHS.map(function(){return{days:0,patId:null};})
        };
      })};
      applyPayload(payload);e.target.value='';
      renderMachineList();renderShiftPanels();renderSummaries();
    }catch(err){alert('Could not load: '+err.message);}
  };
  reader.readAsText(file);
});

        'data-sf data-mid="'+m.id+'" data-pid="'+pat.id+'" data-si="'+si+'" data-f="operators" oninput="syncAll()" onblur="syncAll()" />'+
        '<button onclick="stepOps('+m.id+','+pat.id+','+si+',1)">&#43;</button></div>'+
        '<div class="rate-wrap"><span class="rate-pfx">+$</span>'+
        '<input class="rate-inp" type="number" min="0" step="0.5" value="'+(s.rateAdder||0)+'" '+
        'data-sf data-mid="'+m.id+'" data-pid="'+pat.id+'" data-si="'+si+'" data-f="rateAdder" oninput="syncAll();renderSummaries()" onblur="syncAll();renderSummaries()" /></div>'+
        '<div class="cost-lbl">'+fmt(scost)+'</div>'+
        '<button class="btn-icon" onclick="removeShift('+m.id+','+pat.id+','+si+')">&#10005;</button></div>';
      if(hasErr||hasWarn){
        html+='<div class="shift-errors '+(hasErr?'':'shift-warn-row')+'">';
        v.errors.forEach(function(e){html+='<div class="err-line"><span>&#10006;</span>'+e+'</div>';});
        v.warnings.forEach(function(w){html+='<div class="warn-line"><span>&#9888;</span>'+w+'</div>';});
        html+='</div>';
      }
      html+='<div class="dt-toggle" onclick="toggleDt('+m.id+','+pat.id+','+si+')">'+
        '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'+
        'Downtime<span class="dt-sum" style="color:'+(dtTotal>0?'#c0392b':'#888')+'">'+(dtTotal>0?'-'+dtTotal+' min':'None')+'</span>'+
        '<span class="dt-arr'+(s.dtOpen?' open':'')+'">&#9660;</span></div>';
      if(s.dtOpen){
        html+='<div class="dt-body"><div class="dt-grid">';
        DT_TYPES.forEach(function(t){
          html+='<div class="dt-item"><div class="dt-label"><span class="dt-dot" style="background:'+t.color+'"></span>'+t.label+'</div>'+
            '<div class="dt-input-row"><input class="dt-inp '+(dtErr?'inp-err':'')+'" type="number" min="0" max="9999" value="'+(s.downtime[t.key]||0)+'" '+
            'data-dt="'+t.key+'" data-mid="'+m.id+'" data-pid="'+pat.id+'" data-si="'+si+'" oninput="syncAll()" onblur="syncAll()" />'+
            '<span class="dt-unit">min</span></div></div>';
        });
        html+='</div><div class="prod-row"><span class="prod-lbl">Productive:</span>'+
          '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+bc+'"></div></div>'+
          '<span class="prod-val" style="color:'+bc+'">'+productiveLabel(s)+' ('+pct+'%)</span></div></div>';
      }
      html+='</div>';
    });
    html+='</div><button class="btn-add" style="margin-top:6px;" onclick="addShift('+m.id+','+pat.id+')">+ Add shift to this pattern</button></div></div>';
  });
  html+='</div><button class="btn-add" style="border-color:#d8b4fe;color:#6d28d9;margin-top:4px;" onclick="addPattern('+m.id+')">+ Add pattern</button></div>';
  return html;
}

function renderOpDaysSection(m){
  var html='<div class="sec-toggle tog-green" onclick="toggleOps('+m.id+')">'+
    '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'+
    'Annual operating days &amp; patterns'+
    '<span style="margin-left:8px;font-size:11px;font-weight:500;color:#555;">'+annualOpDays(m)+' days &middot; '+fmt(annualTotalCost(m))+' annual</span>'+
    '<span class="s-arr'+(m.opsOpen?' open':'')+'">&#9660;</span></div>';
  if(!m.opsOpen)return html;
  html+='<div class="sec-body-green"><div class="months-grid">';
  MONTHS.forEach(function(mo,mi){
    var od=m.opDays[mi];
    var patOpts='<option value="">— none —</option>';
    m.patterns.forEach(function(pat){
      patOpts+='<option value="'+pat.id+'"'+(od&&od.patId===pat.id?' selected':'')+'>'+esc(pat.name)+'</option>';
    });
    html+='<div class="month-item">'+
      '<div class="month-lbl">'+mo+' <span style="color:#bbb;font-weight:400;">(max '+MONTH_DAYS[mi]+')</span></div>'+
      '<div class="month-days-row">'+
      '<input class="month-days-inp" type="number" min="0" max="'+MONTH_DAYS[mi]+'" value="'+(od?od.days:0)+'" '+
      'data-opd data-mid="'+m.id+'" data-mi="'+mi+'" oninput="updateOpDay('+m.id+','+mi+',this.value)" onchange="updateOpDay('+m.id+','+mi+',this.value)" />'+
      '<span style="font-size:10px;color:#aaa;">days</span></div>'+
      '<select class="month-pat-sel" data-opp data-mid="'+m.id+'" data-mi="'+mi+'" onchange="updateOpPat('+m.id+','+mi+',this.value)">'+patOpts+'</select>'+
      '</div>';
  });
  html+='</div></div>';
  return html;
}

function renderShiftPanels(){
  var html='';
  machines.filter(function(m){return m.open;}).forEach(function(m){
    var mi=machines.indexOf(m);
    html+='<div class="machine-panel">'+
      '<div class="panel-header" onclick="toggleOpen('+m.id+')">'+
      '<div class="panel-header-left">'+
      '<span class="panel-dot" style="background:'+(m.active?colorFor(mi):'#ccc')+'"></span>'+
      '<span class="panel-name">'+esc(m.name)+'</span>'+
      '<span class="panel-badge">'+m.patterns.length+' pattern'+(m.patterns.length!==1?'s':'')+'</span>'+
      '</div><span class="chevron open">&#8963;</span></div>'+
      '<div class="panel-body">'+renderCostRow(m)+renderPatterns(m)+renderOpDaysSection(m)+renderDefaultsSection(m)+
      '</div></div>';
  });
  document.getElementById('shiftPanels').innerHTML=html;
}

// ── Summaries ─────────────────────────────────────────────────────────────────
function renderSummaries(){
  var active=machines.filter(function(m){return m.active;});
  var nd='<span style="color:#bbb;font-size:18px;">&#8212;</span>';

  // Shift summary — per pattern breakdown only
  var nd='<span style="color:#bbb;font-size:18px;">&#8212;</span>';
  var shiftRows='';
  active.forEach(function(m){
    m.patterns.forEach(function(pat){
      var lpd=patLabourCostPd(m,pat),mpd=patMachCostPd(m,pat);
      var ph=patHpd(pat),pp=patPhpd(pat);
      var av=ph>0?Math.round(pp/ph*100):0,av24=Math.round(pp/24*100);
      shiftRows+='<tr><td><span style="display:inline-flex;align-items:center;gap:5px;">'+
        '<span style="width:8px;height:8px;border-radius:50%;background:'+colorFor(machines.indexOf(m))+';display:inline-block;"></span>'+
        esc(m.name)+'</span></td>'+
        '<td>'+esc(pat.name)+'</td><td>'+pat.shifts.length+'</td>'+
        '<td>'+ph.toFixed(1)+'h</td><td>'+pp.toFixed(1)+'h</td>'+
        '<td>'+pill(av)+'</td><td>'+pill(av24)+'</td><td>'+patOps(pat)+'</td>'+
        '<td style="color:#7a5100;">'+fmt(lpd)+'</td>'+
        '<td style="color:#1a5276;">'+fmt(mpd)+'</td>'+
        '<td style="color:#4a235a;">'+fmt(lpd+mpd)+'</td></tr>';
    });
  });

  document.getElementById('sum-shift').innerHTML=
    '<div class="summary-grid">'+
    '<div class="metric"><div class="metric-lbl">Machines</div><div class="metric-val">'+machines.length+'</div></div>'+
    '<div class="metric"><div class="metric-lbl">Active</div><div class="metric-val">'+active.length+'</div></div>'+
    '</div>'+
    '<div class="overflow-x" style="margin-top:14px;"><table class="ann-table">'+
    '<thead><tr><th>Machine</th><th>Pattern</th><th>Shifts</th><th>Sched.h/d</th><th>Prod.h/d</th>'+
    '<th>Shift av.</th><th>24h av.</th><th>Ops</th><th>Labour/d</th><th>Mach/d</th><th>Total/d</th></tr></thead>'+
    '<tbody>'+shiftRows+'</tbody></table></div>';

  // Annual summary
  var totAD=0,totASH=0,totAPH=0,totALab=0,totAMach=0;
  var annRows='';
  active.forEach(function(m){
    var ad=annualOpDays(m),ash=annualSchedH(m),aph=annualProdH(m);
    var av=annualAvail(m),av24=annualAvail24(m);
    var alab=annualLabourCost(m),amach=annualMachCost(m);
    totAD+=ad;totASH+=ash;totAPH+=aph;totALab+=alab;totAMach+=amach;
    annRows+='<tr><td><span style="display:inline-flex;align-items:center;gap:5px;">'+
      '<span style="width:8px;height:8px;border-radius:50%;background:'+colorFor(machines.indexOf(m))+';display:inline-block;"></span>'+
      esc(m.name)+'</span></td>'+
      '<td>'+ad+'</td><td>'+ash.toFixed(1)+'h</td><td>'+aph.toFixed(1)+'h</td>'+
      '<td>'+pill(av)+'</td><td>'+pill(av24)+'</td>'+
      '<td style="color:#7a5100;">'+fmt(alab)+'</td>'+
      '<td style="color:#1a5276;">'+fmt(amach)+'</td>'+
      '<td style="color:#4a235a;">'+fmt(alab+amach)+'</td></tr>';
  });
  var totAAv=totASH>0?Math.round(totAPH/totASH*100):0;
  var totACal=active.reduce(function(a,m){return a+annualOpDays(m)*24;},0);
  var totAAv24=totACal>0?Math.round(totAPH/totACal*100):0;

  document.getElementById('sum-annual').innerHTML=
    '<div class="summary-grid" style="margin-bottom:14px;">'+
    '<div class="metric"><div class="metric-lbl">Total op. days</div><div class="metric-val">'+totAD+'</div></div>'+
    '<div class="metric"><div class="metric-lbl">Scheduled h</div><div class="metric-val">'+totASH.toFixed(0)+'h</div></div>'+
    '<div class="metric"><div class="metric-lbl">Productive h</div><div class="metric-val" style="color:'+barColor(totAAv)+'">'+totAPH.toFixed(0)+'h</div></div>'+
    '<div class="metric"><div class="metric-lbl">Shift avail.</div><div class="metric-val" style="color:'+barColor(totAAv)+'">'+totAAv+'%</div></div>'+
    '<div class="metric"><div class="metric-lbl">24h avail.</div><div class="metric-val" style="color:'+barColor(totAAv24)+'">'+totAAv24+'%</div></div>'+
    '<div class="metric cost"><div class="metric-lbl">Annual labour</div><div class="metric-val">'+fmt(totALab)+'</div></div>'+
    '<div class="metric cost"><div class="metric-lbl">Annual machine</div><div class="metric-val">'+fmt(totAMach)+'</div></div>'+
    '<div class="metric cost"><div class="metric-lbl">Annual total</div><div class="metric-val">'+fmt(totALab+totAMach)+'</div></div>'+
    '</div>'+
    '<div class="overflow-x"><table class="ann-table">'+
    '<thead><tr><th>Machine</th><th>Op.days</th><th>Sched.h</th><th>Prod.h</th><th>Shift av.</th><th>24h av.</th><th>Labour</th><th>Machine</th><th>Total</th></tr></thead>'+
    '<tbody>'+annRows+
    '<tr class="totals-row"><td>Total</td><td>'+totAD+'</td><td>'+totASH.toFixed(1)+'h</td><td>'+totAPH.toFixed(1)+'h</td>'+
    '<td>'+pill(totAAv)+'</td><td>'+pill(totAAv24)+'</td>'+
    '<td style="color:#7a5100;">'+fmt(totALab)+'</td><td style="color:#1a5276;">'+fmt(totAMach)+'</td>'+
    '<td style="color:#4a235a;">'+fmt(totALab+totAMach)+'</td></tr>'+
    '</tbody></table></div>';

  // Monthly summary
  var mHdr='<thead><tr><th>Month</th>';
  active.forEach(function(m){mHdr+='<th colspan="5" style="text-align:center;border-left:2px solid #e0dfd8;">'+esc(m.name)+'</th>';});
  mHdr+='<th colspan="5" style="text-align:center;border-left:2px solid #378ADD;">Total</th></tr>';
  mHdr+='<tr><th></th>';
  active.forEach(function(){mHdr+='<th style="border-left:2px solid #e0dfd8;">Days</th><th>Pattern</th><th>Prod.h</th><th>Av%</th><th>Cost</th>';});
  mHdr+='<th style="border-left:2px solid #378ADD;">Days</th><th>Prod.h</th><th>Av%</th><th>Labour</th><th>Total</th></tr></thead>';

  var mBody='<tbody>';
  var macTot=active.map(function(){return{days:0,sh:0,ph:0,lab:0,mach:0};});
  var gD=0,gSH=0,gPH=0,gLab=0,gMach=0;
  MONTHS.forEach(function(mo,mi){
    var rD=0,rSH=0,rPH=0,rLab=0,rMach=0;
    var row='<tr><td><strong>'+mo+'</strong> <span style="font-size:10px;color:#aaa;">('+MONTH_DAYS[mi]+'d)</span></td>';
    active.forEach(function(m,xi){
      var od=m.opDays[mi],days=od?od.days:0;
      var pat=od&&od.patId?getPat(m,od.patId):null;
      var sh=pat?days*patHpd(pat):0,ph=pat?days*patPhpd(pat):0;
      var lab=pat?days*patLabourCostPd(m,pat):0,mach=pat?days*patMachCostPd(m,pat):0;
      var av=sh>0?Math.round(ph/sh*100):0;
      macTot[xi].days+=days;macTot[xi].sh+=sh;macTot[xi].ph+=ph;macTot[xi].lab+=lab;macTot[xi].mach+=mach;
      rD+=days;rSH+=sh;rPH+=ph;rLab+=lab;rMach+=mach;
      row+='<td style="border-left:2px solid #e0dfd8;">'+days+'</td>'+
           '<td style="font-size:10px;color:#6d28d9;">'+(pat?esc(pat.name):'-')+'</td>'+
           '<td>'+ph.toFixed(1)+'</td><td>'+pill(av)+'</td>'+
           '<td style="color:#4a235a;font-size:11px;">'+fmt(lab+mach)+'</td>';
    });
    var rAv=rSH>0?Math.round(rPH/rSH*100):0;
    gD+=rD;gSH+=rSH;gPH+=rPH;gLab+=rLab;gMach+=rMach;
    row+='<td style="border-left:2px solid #378ADD;font-weight:600;">'+rD+'</td>'+
         '<td style="font-weight:600;">'+rPH.toFixed(1)+'</td><td>'+pill(rAv)+'</td>'+
         '<td style="color:#7a5100;font-size:11px;">'+fmt(rLab)+'</td>'+
         '<td style="color:#4a235a;font-weight:600;font-size:11px;">'+fmt(rLab+rMach)+'</td></tr>';
    mBody+=row;
  });
  var gAv=gSH>0?Math.round(gPH/gSH*100):0;
  mBody+='<tr class="totals-row"><td>Total</td>';
  macTot.forEach(function(t){
    var av=t.sh>0?Math.round(t.ph/t.sh*100):0;
    mBody+='<td style="border-left:2px solid #e0dfd8;">'+t.days+'</td><td></td>'+
           '<td>'+t.ph.toFixed(1)+'</td><td>'+pill(av)+'</td>'+
           '<td style="color:#4a235a;">'+fmt(t.lab+t.mach)+'</td>';
  });
  mBody+='<td style="border-left:2px solid #378ADD;">'+gD+'</td><td>'+gPH.toFixed(1)+'</td><td>'+pill(gAv)+'</td>'+
         '<td style="color:#7a5100;">'+fmt(gLab)+'</td><td style="color:#4a235a;">'+fmt(gLab+gMach)+'</td></tr></tbody>';
  document.getElementById('sum-monthly').innerHTML='<div class="overflow-x"><table class="ann-table">'+mHdr+mBody+'</table></div>';

  // Validation banner
  var valMap=validateAll();
  var allErrs=Object.values(valMap).reduce(function(a,v){return a+v.errors.length;},0);
  var allWarns=Object.values(valMap).reduce(function(a,v){return a+v.warnings.length;},0);
  var banner=document.getElementById('valBanner'),btn=document.getElementById('exportBtn');
  if(allErrs>0){
    banner.innerHTML='<div class="val-banner error">&#10006; &nbsp;<strong>'+allErrs+' error'+(allErrs!==1?'s':'')+'</strong>&nbsp;must be fixed before exporting.</div>';
    btn.disabled=true;btn.style.opacity='0.45';btn.style.cursor='not-allowed';
  }else if(allWarns>0){
    banner.innerHTML='<div class="val-banner ok" style="background:#fffaf3;border-color:#fad7a0;color:#7d4e00;">&#9888; &nbsp;<strong>'+allWarns+' warning'+(allWarns!==1?'s':'')+'</strong> &#8212; review before exporting.</div>';
    btn.disabled=false;btn.style.opacity='1';btn.style.cursor='pointer';
  }else{
    banner.innerHTML='<div class="val-banner ok">&#10004; &nbsp;All shifts are valid.</div>';
    btn.disabled=false;btn.style.opacity='1';btn.style.cursor='pointer';
  }
  document.getElementById('hdr-meta').textContent=machines.length+' machine'+(machines.length!==1?'s':'')+' &middot; '+active.length+' active';
}

function renderAll(skipSync){
  if(!skipSync)syncAll();
  renderMachineList();renderShiftPanels();renderSummaries();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
if(!loadFromURL())applyPayload(SAVED_CONFIG);
renderMachineList();renderShiftPanels();renderSummaries();
</script>
</body>
</html>
